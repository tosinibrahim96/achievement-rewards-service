[www]
user = app
group = app
listen = 9000
listen.owner = app
listen.group = app
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
ping.path = /fpm-ping
